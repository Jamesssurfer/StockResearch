<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Research - 10 Framework Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>📊 Stock Research </h1>
                <span class="subtitle">10 Framework Analysis Platform</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search ticker or company..." />
                <button class="search-btn" onclick="analyzer.searchStock()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Watchlist Sidebar -->
            <aside class="watchlist-sidebar">
                <div class="watchlist-header">
                    <h2>⭐ Watchlist</h2>
                    <span class="count-badge" id="watchlistCount">0</span>
                </div>
                <div id="watchlistItems" class="watchlist-items">
                    <!-- Watchlist items will be rendered here -->
                </div>
            </aside>

            <!-- Analysis Area -->
            <main class="analysis-area">
                <!-- Stock Overview -->
                <div id="stockOverview" class="stock-overview hidden">
                    <div class="stock-header">
                        <div>
                            <h2 id="stockName">Company Name</h2>
                            <span id="stockSymbol" class="stock-symbol">TICKER</span>
                            <span id="stockExchange" class="stock-exchange"></span>
                        </div>
                        <div class="stock-price-container">
                            <div class="stock-price">
                                <span id="currentPrice">$0.00</span>
                                <span id="priceChange" class="price-change">0.00%</span>
                            </div>
                            <div id="lastUpdated" class="last-updated"></div>
                        </div>
                    </div>

                    <!-- OHLC Data -->
                    <div class="ohlc-container">
                        <h3>Latest Trading Session</h3>
                        <div class="ohlc-grid">
                            <div class="ohlc-item">
                                <span class="ohlc-label">Open</span>
                                <span class="ohlc-value" id="openPrice">-</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">High</span>
                                <span class="ohlc-value high" id="highPrice">-</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">Low</span>
                                <span class="ohlc-value low" id="lowPrice">-</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">Previous Close</span>
                                <span class="ohlc-value" id="prevClosePrice">-</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">Volume</span>
                                <span class="ohlc-value" id="volumeData">-</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">Avg Volume (30d)</span>
                                <span class="ohlc-value" id="avgVolume">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Stats -->
                    <div class="quick-stats" id="quickStats">
                        <!-- Quick stats will be rendered here -->
                    </div>

                    <!-- Charts Section -->
                    <div class="charts-container">
                        <div class="chart-wrapper">
                            <h3>30-Day Price History</h3>
                            <canvas id="priceChart"></canvas>
                        </div>
                        <div class="chart-wrapper">
                            <h3>30-Day Volume History</h3>
                            <canvas id="volumeChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Add to Watchlist Button -->
                <div id="watchlistAction" class="watchlist-action hidden">
                    <button onclick="analyzer.toggleWatchlist()" id="watchlistBtn" class="watchlist-btn">
                        ⭐ Add to Watchlist
                    </button>
                </div>

                <!-- Framework Tabs -->
                <div class="framework-tabs" id="frameworkTabs">
                    <button class="tab-btn active" data-framework="overview">Overview</button>
                    <button class="tab-btn" data-framework="oneil">O'Neil</button>
                    <button class="tab-btn" data-framework="blackscholes">Black-Scholes</button>
                    <button class="tab-btn" data-framework="buffett">Buffett</button>
                    <button class="tab-btn" data-framework="famafrench">Fama-French</button>
                    <button class="tab-btn" data-framework="magicformula">Magic Formula</button>
                    <button class="tab-btn" data-framework="piotroski">Piotroski</button>
                    <button class="tab-btn" data-framework="graham">Graham</button>
                    <button class="tab-btn" data-framework="acquirer">Acquirer's</button>
                    <button class="tab-btn" data-framework="minervini">Minervini</button>
                    <button class="tab-btn" data-framework="lynch">Lynch</button>
                </div>

                <!-- Framework Content -->
                <div id="frameworkContent" class="framework-content">
                    <!-- Framework analysis will be rendered here -->
                </div>
            </main>
        </div>
    </div>

    <script src="frameworks/oneil.js"></script>
    <script src="frameworks/blackScholes.js"></script>
    <script src="frameworks/buffett.js"></script>
    <script src="frameworks/famaFrench.js"></script>
    <script src="frameworks/magicFormula.js"></script>
    <script src="frameworks/piotroski.js"></script>
    <script src="frameworks/graham.js"></script>
    <script src="frameworks/acquirerMultiple.js"></script>
    <script src="frameworks/minervini.js"></script>
    <script src="frameworks/lynch.js"></script>
    <script src="script.js"></script>
</body>
</html>
