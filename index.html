<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analyzer Pro - Static Data Version</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <h1>📊 StockAnalyzer Pro</h1>
                <span class="subtitle">Static Data Version</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Enter ticker (e.g., AAPL)" />
                <button class="search-btn" onclick="analyzer.loadStaticData()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </header>
        <div class="main-content">
            <aside class="watchlist-sidebar">
                <div class="watchlist-header">
                    <h2>⭐ Watchlist</h2>
                    <span class="count-badge" id="watchlistCount">0</span>
                </div>
                <div id="watchlistItems" class="watchlist-items"></div>
                <div class="available-stocks">
                    <h3>Available Stocks</h3>
                    <div id="availableStocks" class="available-stocks-list"></div>
                </div>
            </aside>
            <main class="analysis-area">
                <div id="stockOverview" class="stock-overview hidden">
                    <div class="stock-header">
                        <div class="stock-title">
                            <h2 id="stockName">-</h2>
                            <span id="stockSymbol" class="stock-symbol">-</span>
                        </div>
                        <div class="price-block">
                            <span id="currentPrice" class="current-price">$0.00</span>
                            <span id="priceChange" class="price-change">-</span>
                        </div>
                    </div>

                    <div class="ohlc-row">
                        <div class="ohlc-item">
                            <span class="ohlc-label">Open</span>
                            <span id="openPrice">-</span>
                        </div>
                        <div class="ohlc-item">
                            <span class="ohlc-label">High</span>
                            <span id="highPrice">-</span>
                        </div>
                        <div class="ohlc-item">
                            <span class="ohlc-label">Low</span>
                            <span id="lowPrice">-</span>
                        </div>
                        <div class="ohlc-item">
                            <span class="ohlc-label">Prev Close</span>
                            <span id="prevClosePrice">-</span>
                        </div>
                        <div class="ohlc-item">
                            <span class="ohlc-label">Volume</span>
                            <span id="volumeData">-</span>
                        </div>
                    </div>

                    <div id="quickStats" class="quick-stats"></div>

                    <div class="charts-row">
                        <div class="chart-container">
                            <canvas id="priceChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <canvas id="volumeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="frameworkContent" class="framework-content"></div>
            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script_static.js"></script>
</body>
</html>
